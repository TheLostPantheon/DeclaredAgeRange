name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned deliberately. The .NET for iOS/macOS workload requires an exact major.minor Xcode
          # and hard-errors otherwise (E0191), so `latest-stable` silently breaks release builds the
          # day the runner image moves on. Bump this together with the workload.
          xcode-version: '26.6'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install iOS and macOS workloads
        run: dotnet workload install ios macos

      - name: Build Swift bridge xcframework
        run: make -C native

      # Tag v1.2.3 -> package version 1.2.3. Untagged builds get a pre-release version so they never collide.
      - name: Compute package version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack DeclaredAgeRange
        run: dotnet pack src/DeclaredAgeRange -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}

      # The samples reference the project directly, which reaches the xcframework on disk — that build
      # stays green even if the packed .nupkg is broken. This consumes the real package as a user would.
      - name: Smoke-test the package as a consumer
        env:
          PKG_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          rm -rf .consumer-test && mkdir -p .consumer-test
          # Copied at the same depth as samples/, so each sample's other relative paths still resolve.
          cp -R samples/iOSSampleApp samples/macOSSampleApp .consumer-test/
          for proj in .consumer-test/*/*.csproj; do
            sed -i.bak -E 's|<ProjectReference [^>]*DeclaredAgeRange\.csproj" ?/>|<PackageReference Include="DeclaredAgeRange" Version="'"$PKG_VERSION"'" />|' "$proj"
            rm -f "$proj.bak"
            if ! grep -q 'PackageReference Include="DeclaredAgeRange"' "$proj"; then
              echo "::error::Failed to swap the project reference for a package reference in $proj"
              exit 1
            fi
            if grep -q '<ProjectReference' "$proj"; then
              echo "::error::A ProjectReference survived in $proj — the smoke test would not be testing the package"
              exit 1
            fi
          done
          SOURCES=(--source "$GITHUB_WORKSPACE/artifacts" --source https://api.nuget.org/v3/index.json)
          dotnet build .consumer-test/iOSSampleApp -c Release -r iossimulator-arm64 "${SOURCES[@]}"
          dotnet build .consumer-test/macOSSampleApp -c Release "${SOURCES[@]}"
          # The native bridge must travel inside the package, not just alongside the project.
          # Checked per sample under bin/ only: macOS emits several bundles (universal plus per-RID) and
          # obj/ holds an intermediate codesign bundle that legitimately has no frameworks yet.
          for sample in iOSSampleApp macOSSampleApp; do
            app=$(find ".consumer-test/$sample/bin" -maxdepth 4 -name '*.app' | head -1)
            if [ -z "$app" ]; then
              echo "::error::$sample produced no .app bundle — the consumer build silently made no output"
              exit 1
            fi
            if ! find "$app" -name 'DeclaredAgeRangeWrapper.framework' | grep -q .; then
              echo "::error::$app is missing the native framework — the package does not carry the xcframework"
              exit 1
            fi
            echo "verified native framework in $app"
          done

      - name: Unit tests (pure managed logic)
        run: dotnet test tests/DeclaredAgeRange.Tests -c Release

      - name: Build iOS sample (simulator, ad-hoc signed)
        run: dotnet build samples/iOSSampleApp -c Debug -r iossimulator-arm64

      - name: Build macOS sample (ad-hoc signed)
        run: dotnet build samples/macOSSampleApp -c Debug

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: DeclaredAgeRange.nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: DeclaredAgeRangeWrapper.xcframework
          path: native/DeclaredAgeRangeWrapper.xcframework

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Kept so the trusted publishing policy can later be narrowed to this environment,
    # and so a manual approval gate can be added here without touching the workflow.
    environment: nuget
    permissions:
      id-token: write   # lets this job request the OIDC token nuget.org exchanges for a key
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: DeclaredAgeRange.nupkg
          path: artifacts

      # Trusted publishing: swaps this workflow's signed OIDC token for an API key that is valid for
      # one hour and usable once, so no long-lived NuGet key is ever stored in this repository.
      # Must sit immediately before the push — request it early and it can expire first.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: TheLostPantheon   # nuget.org profile name, not an email address

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
